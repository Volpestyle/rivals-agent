[project]
name = "rivals-agent"
version = "0.0.0"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest"]
perception = ["opencv-python-headless>=4.10", "numpy>=2.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# A bare `uv run pytest` is stdlib-only: tests/conftest.py skips the modules that import cv2, numpy or
# `perception` unless opencv and numpy are installed. `uv run --group perception pytest` collects them too
# (they also need recorded data under data/, which is gitignored and not on every machine).
